# Extensionless Moodle scripts — Apache staging/production.
# Equivalent of .ddev/nginx/extensionless-php.conf (DDEV-only; do not copy that file here).
#
# Maps /admin/search → /admin/search.php when the .php file exists.
# Does NOT match trailing-slash dirs (/my/, /course/) — those stay directory indexes.
#
# Prefer VirtualHost (more reliable than .htaccess alone):
#
#   Inside the HTTPS <VirtualHost> for staginglms…, after RewriteEngine On:
#     Include conf.d/extensionless-php.inc
#   Or paste the RewriteRule block below into the vhost.
#
# If using .htaccess in the Moodle docroot instead, drop the leading slash
# from the RewriteRule pattern (see “.htaccess variant” at bottom).
#
# Also keep the dedicated /login rule (see docs/extensionless-urls.md):
#   RewriteRule ^/login/?$ /login/index.php [L,QSA]
#
# After install:
#   sudo apachectl configtest && sudo systemctl reload httpd
#
# Verify:
#   curl -sI 'https://staginglms.eci.gov.in/admin/search' | head -5
#   Expect 200 or auth redirect — not 404. pluginfile.php/… must still contain .php.

RewriteEngine On

# /login is special (real directory) — handle before generic extensionless.
RewriteRule ^/login/?$ /login/index.php [L,QSA]

# If request has no file extension and no trailing slash, and {path}.php exists → use it.
# Skip real files/dirs and anything that already has a dot in the last segment.
RewriteCond %{REQUEST_FILENAME} !-f
RewriteCond %{REQUEST_FILENAME} !-d
RewriteCond %{REQUEST_URI} !\.[^/]+$
RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI}.php -f
RewriteRule ^(.*)$ $1.php [L,QSA]

