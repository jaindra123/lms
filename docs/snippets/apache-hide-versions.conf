# PHP / server version information disclosure (audit finding #14).
# Install on Apache Moodle hosts (staging/production), then reload httpd.
#
#   sudo cp apache-hide-versions.conf /etc/httpd/conf.d/
#   sudo systemctl reload httpd
#
# Also set in php.ini (or drop-in):
#   expose_php = Off
#
# Verify:
#   curl -sI https://YOUR-HOST/login/index.php | grep -iE '^(Server|X-Powered-By):'
# Expect: no X-Powered-By; no Server: Apache (header absent or blank).

ServerTokens Prod
ServerSignature Off

<IfModule mod_headers.c>
    Header unset X-Powered-By
    Header always unset X-Powered-By
    Header unset X-AspNet-Version
    Header always unset X-AspNet-Version
    Header unset X-AspNetMvc-Version
    Header always unset X-AspNetMvc-Version
    Header unset X-Generator
    Header always unset X-Generator

    # CDAC: deprecated X-UA-Compatible (IE=edge).
    Header unset X-UA-Compatible
    Header always unset X-UA-Compatible
    # Hide product banner (CDAC: Server: Apache). unset + edit so a regenerated
    # Server token is blanked if Apache re-adds it after the first unset.
    Header unset Server
    Header always unset Server
    Header unset Server early
    Header always unset Server early
    Header edit Server ^.*$ " "
    Header always edit Server ^.*$ " "
</IfModule>

# If mod_security is loaded, replace the Server banner entirely.
<IfModule security2_module>
    SecServerSignature " "
</IfModule>
<IfModule mod_security.c>
    SecServerSignature " "
</IfModule>

# Block leftover phpinfo / probe scripts in the web root.
# Moodle’s real page is /admin/phpinfo.php (requires site admin login).
<IfModule mod_rewrite.c>
    RewriteEngine On
    RewriteRule ^/?info\.php$ - [F,L]
    RewriteRule ^/?phpinfo\.php$ - [F,L]
    RewriteRule ^/?test\.php$ - [F,L]
    RewriteRule ^/?i\.php$ - [F,L]
</IfModule>

# If rewrite is unavailable, use Location blocks instead (DocumentRoot = Moodle root):
# <Location "/info.php">
#     Require all denied
# </Location>
# <Location "/phpinfo.php">
#     Require all denied
# </Location>
# <Location "/test.php">
#     Require all denied
# </Location>
