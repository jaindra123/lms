# Razorpay Checkout public path — staging/production nginx / Tengine / OpenResty.
# Include inside the LMS HTTPS server { } block.
# DDEV already loads .ddev/nginx/checkout-public-404.conf.
#
# CDAC PoC: GET api.razorpay.com/v1/checkout/public with Referer staginglms
# (Checkout iframe). This rule only covers the LMS origin.

location ~* /v1/checkout/(public|qr_code) {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    return 404 '{"ok":false,"success":false,"error":"notfound"}';
}
