# Apache: security response headers (CDAC #15 Header Issues)

# Place as /etc/httpd/conf.d/security-headers.conf (or include from ssl vhost).
# Moodle theme_iiidem2 sends CSP/COOP/etc. from PHP. HSTS is edge-only — do not
# also set it in PHP or a second vhost (CDAC duplicate Strict-Transport-Security).
# Do NOT duplicate a conflicting CSP here — PHP CSP is the source of truth.

<IfModule mod_setenvif.c>
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
</IfModule>
<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(self), usb=()"
    Header always unset Cross-Origin-Opener-Policy
    Header always set Cross-Origin-Opener-Policy "same-origin"

    # PHP chooses X-Frame-Options DENY vs SAMEORIGIN and sends X-XSS-Protection.
    Header unset X-Frame-Options
    Header always unset X-Frame-Options
    Header unset X-XSS-Protection
    Header always unset X-XSS-Protection

    # One HSTS only: drop PHP (onsuccess) + vhost (always), then set once.
    Header unset Strict-Transport-Security
    Header always unset Strict-Transport-Security
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" env=HTTPS

    # Version disclosure — hide Server / PHP banners (see apache-hide-versions.conf)
    Header unset X-Powered-By
    Header always unset X-Powered-By
    Header unset Server
    Header always unset Server
    Header unset Server early
    Header always unset Server early
    Header edit Server ^.*$ " "
    Header always edit Server ^.*$ " "

    # CDAC: deprecated X-UA-Compatible (IE=edge) must not be sent.
    Header unset X-UA-Compatible
    Header always unset X-UA-Compatible
</IfModule>
