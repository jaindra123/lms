# Apache: security response headers (CDAC #15 Header Issues)

# Place as /etc/httpd/conf.d/security-headers.conf (or include from ssl vhost).
# Moodle theme_iiidem2 already sends these from PHP; edge headers are belt-and-braces
# when a request skips the theme hook. Do NOT duplicate a conflicting CSP here —
# PHP CSP is the source of truth (Razorpay / MathJax allow-lists).

<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(self), usb=()"
    Header always set Cross-Origin-Opener-Policy "same-origin-allow-popups"

    # HSTS — only on HTTPS virtual hosts (or use env=HTTPS).
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" env=HTTPS

    # Version disclosure — also see apache-hide-versions.conf
    Header unset X-Powered-By
    Header always unset X-Powered-By
</IfModule>
