# Directory listing — staging/production edge (nginx / Tengine).
# Include inside the LMS HTTPS server { } block.
# DDEV already loads .ddev/nginx/directory-listing.conf.
#
# CDAC #20: PoC showed Tengine 200 + HTML index with backup/ link.
# Expect: autoindex off → 403/404 for dirs without DirectoryIndex — never a file table.

autoindex off;

location ^~ /backups/ {
    deny all;
    return 403;
}
location ^~ /moodledata/ {
    deny all;
    return 403;
}
location ^~ /local_dev_logs/ {
    deny all;
    return 403;
}
location ^~ /docs/ {
    deny all;
    return 403;
}
location ^~ /scripts/ {
    deny all;
    return 403;
}
location ^~ /.git/ {
    deny all;
    return 403;
}

location ~* ^/config\.(staging|production|dev)\.php$ {
    deny all;
    return 403;
}

# Hide empty / internal scripts flagged as "directory listing" (blank 200).
location = /config { return 404; }
location = /config.php { return 404; }
location = /version { return 404; }
location = /version.php { return 404; }
location = /security { return 404; }
location = /security.php { return 404; }
location = /cache/forms { return 404; }
location = /cache/forms.php { return 404; }
location = /cache/forms/ { return 404; }
location = /auth/index.html { return 404; }

# Leftover phpinfo / probe scripts (not Moodle /admin/phpinfo.php).
location = /info.php { deny all; return 403; }
location = /phpinfo.php { deny all; return 403; }
location = /test.php { deny all; return 403; }

# Apache default icons tree (CDAC Instance 2) — not used by Moodle.
location ^~ /icons/ {
    deny all;
    return 404;
}

# CDAC Instance 3 — pluginfile path ending with / (no filename). App also enforces this.
location ~* ^/(?:webservice/)?(?:token)?pluginfile\.php/.+/$ {
    return 403;
}

# Optional Moodle artefact hide (MDL-69333) — see docs/directory-listing.md.
# RT-001: npm-shrinkwrap.json must not be public (CWE-200). Keep the file on disk
# for grunt/npm; only deny HTTP.
location = /npm-shrinkwrap.json { deny all; return 404; }
location = /package-lock.json { deny all; return 404; }
location = /package.json { deny all; return 404; }
location = /yarn.lock { deny all; return 404; }
location = /pnpm-lock.yaml { deny all; return 404; }
location ~* (?:/vendor/|/node_modules/|/composer\.(?:json|lock)$|/package(?:-lock)?\.json$|/npm-shrinkwrap\.json$|/yarn\.lock$|/pnpm-lock\.yaml$|\.lock$) {
    deny all;
    return 404;
}
