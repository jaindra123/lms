# Host header injection — staging/production TLS edge (nginx / Tengine / OpenResty).
# Reject Host: vulnerable.com instead of 302 to a parking URL.
#
# The auditor PoC (openresty/1.31.1.1):
#   GET /login/?wantsurl=…  Host: vulnerable.com
#   → 302 Location: https://awsellm.com/domain/vulnerable.com
# That 302 is the DEFAULT vhost, not Moodle. PHP also returns 400 (config.php).
#
# Inside the REAL LMS server { }:
#   server_name staginglms.eci.gov.in;
# Never: server_name _;  never: return 301 https://$host$request_uri;
#
# Catch-all (HTTP + HTTPS). Copy beside the LMS vhost and reload.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 400;
}

