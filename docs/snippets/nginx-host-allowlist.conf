# Host header injection — staging/production TLS edge only.
# Reject requests whose Host is not the real LMS hostname.
#
# Usage:
#   1) In the real site server { }:
#        server_name staginglms.eci.gov.in;
#        # never: server_name _;
#
#   2) Include a default catch-all (HTTP and HTTPS) that drops unknown hosts:
#        include /path/to/nginx-host-allowlist.conf;
#
# Do not put this in DDEV .ddev/nginx/ — the router owns Host routing locally.

# --- Default catch-all (add one for :80 and one for :443 with ssl_*) ---
# server {
#     listen 80 default_server;
#     listen [::]:80 default_server;
#     server_name _;
#     return 444;
# }
#
# server {
#     listen 443 ssl default_server;
#     listen [::]:443 ssl default_server;
#     server_name _;
#     # ssl_certificate / ssl_certificate_key as required by your edge
#     return 444;
# }

# Inside the real LMS server block, prefer hard-coded redirects:
#   return 301 https://staginglms.eci.gov.in$request_uri;
# Not:
#   return 301 https://$host$request_uri;
