# Prefill encrypt path — staging/production nginx / Tengine / OpenResty.
# Include inside the LMS HTTPS server { } block.
# DDEV already loads .ddev/nginx/prefill-encrypt-429.conf.
#
# CDAC Intruder was against Host: api.razorpay.com. This rule only covers the
# LMS origin so a replay of that path here cannot mint prefill_data_v1.

location ~* prefill/encrypt {
    default_type application/json;
    add_header Retry-After 600 always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    return 429 '{"ok":false,"success":false,"error":"ratelimit"}';
}
