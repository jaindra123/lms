# LUCKY13 / CBC cipher suites — include inside the HTTPS server { } that
# terminates TLS (or in a shared ssl params file).
# Moodle / PHP cannot set these; apply on staging/production edge only.
#
# Usage (nginx):
#   include /path/to/nginx-tls-no-cbc.conf;
#
# Restart nginx after change. Do not include this in DDEV's .ddev/nginx/
# snippets — those run behind the DDEV router and are HTTP-only.

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;

# AEAD only (GCM / ChaCha20-Poly1305). No CBC → mitigates LUCKY13 exposure.
ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';

# Optional hardening (safe defaults for public LMS):
ssl_session_timeout 1d;
ssl_session_cache shared:SSL:10m;
ssl_session_tickets off;
