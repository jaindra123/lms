# SSL/TLS Insecurity / LUCKY13 (CVE-2013-0169)
# Disable TLS 1.2 CBC suites (SSL Labs "WEAK"):
#   TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA256  (OpenSSL: ECDHE-RSA-AES128-SHA256)
#   TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA384  (OpenSSL: ECDHE-RSA-AES256-SHA384)
#
# Include inside the HTTPS server { } that TERMINATES TLS
# (Tengine / nginx / load balancer). Moodle / PHP / .htaccess cannot set this.
#
#   include /etc/nginx/snippets/nginx-tls-no-cbc.conf;
#   nginx -t && systemctl reload nginx
#
# Keep TLS 1.2 + 1.3. Offer AEAD only (AES-GCM + ChaCha20-Poly1305, SHA-256/384).
# Do not offer SSLv3, TLS 1.0, TLS 1.1, RC4, 3DES, or any CBC suite.

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;

ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:!ECDHE-RSA-AES128-SHA256:!ECDHE-RSA-AES256-SHA384:!ECDHE-ECDSA-AES128-SHA256:!ECDHE-ECDSA-AES256-SHA384:!AES128-SHA256:!AES256-SHA384:!CBC:!aNULL:!eNULL:!EXPORT:!DES:!3DES:!RC4:!MD5:!PSK:!SRP:!CAMELLIA:!ARIA:!DSS:!SHA1';

# If nginx -t fails on ecdh_curve (very old OpenSSL), comment the next line out.
ssl_ecdh_curve X25519:prime256v1:secp384r1;

ssl_session_timeout 1d;
ssl_session_cache shared:SSL:10m;
ssl_session_tickets off;
