# Prefill encrypt path — Apache staging/production (inside the LMS vhost or .htaccess).
# Root .htaccess already contains the same RewriteRule.
# PHP fallback: theme/iiidem2/prefill_encrypt_deny.php

<IfModule mod_rewrite.c>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} prefill/encrypt [NC]
    RewriteRule ^ theme/iiidem2/prefill_encrypt_deny.php [END]
</IfModule>
