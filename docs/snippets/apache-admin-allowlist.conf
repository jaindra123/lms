# Restrict Moodle /admin/ to trusted IPs only (Apache 2.4).
# Audit: Unauthenticated Access to Administrative Interface
# See docs/restrict-admin-access.md
#
# IMPORTANT: Do NOT block /admin/tool/mfa/ — MFA runs after login for all
# users and lives under /admin/. Blocking it causes 403 on auth.php.
#
# Place in the vhost / conf.d (preferred). Replace IPs with office/VPN.

# Allow MFA for everyone (must come before the restricted block, or use
# negative lookahead in LocationMatch as below).

<LocationMatch "^/admin/tool/mfa">
    Require all granted
</LocationMatch>

# Restrict the rest of /admin/ (Site administration UI) to trusted IPs.
# (?!tool/mfa) = everything under /admin/ except MFA.
<LocationMatch "^/admin(/|$)(?!tool/mfa)">
    Require ip 127.0.0.1
    Require ip ::1
    # --- EDIT: trusted networks (office / VPN) ---
    # Require ip 10.26.89.1
    # Require ip 10.206.96.0/23
    # Require ip YOUR.PUBLIC.OFFICE.IP
</LocationMatch>
