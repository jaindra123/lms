# LUCKY13 / CBC cipher suites — Apache VirtualHost that terminates TLS.
# Include inside <VirtualHost *:443> or a shared SSL include.
# Do not put this in .htaccess (SSLCipherSuite requires server config).

SSLEngine on
SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
SSLHonorCipherOrder off

# AEAD only (no CBC). TLS 1.3 suites are negotiated separately and are AEAD.
SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
