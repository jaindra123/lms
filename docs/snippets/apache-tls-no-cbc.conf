# SSL/TLS Insecurity / LUCKY13 (CVE-2013-0169)
# Disable TLS 1.2 CBC suites (SSL Labs "WEAK"):
#   TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA256  (OpenSSL: ECDHE-RSA-AES128-SHA256)
#   TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA384  (OpenSSL: ECDHE-RSA-AES256-SHA384)
#
# Include inside <VirtualHost *:443> (or a shared SSL include).
# Do not put this in .htaccess — SSLCipherSuite requires server config.
#
#   Include conf.d/apache-tls-no-cbc.conf
#   apachectl configtest && systemctl reload httpd
#
# Moodle / PHP cannot set TLS ciphers.

SSLEngine on
SSLProtocol -all +TLSv1.2 +TLSv1.3
SSLHonorCipherOrder off
SSLCompression off
SSLSessionTickets off

# AEAD only (AES-GCM + ChaCha20). SHA-256/384 AEAD MACs — not CBC-SHA256.
SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:!ECDHE-RSA-AES128-SHA256:!ECDHE-RSA-AES256-SHA384:!ECDHE-ECDSA-AES128-SHA256:!ECDHE-ECDSA-AES256-SHA384:!AES128-SHA256:!AES256-SHA384:!CBC:!aNULL:!eNULL:!EXPORT:!DES:!3DES:!RC4:!MD5:!PSK:!SRP:!CAMELLIA:!ARIA:!DSS:!SHA1

# Apache 2.4.37+ (optional; comment out if configtest rejects it):
# SSLCipherSuite TLSv1.3 TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256
