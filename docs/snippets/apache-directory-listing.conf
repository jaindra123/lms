# Directory listing + sensitive path deny — Apache staging/production.
# Equivalent of .ddev/nginx/directory-listing.conf (DDEV-only; do not copy that file here).
#
#   sudo cp apache-directory-listing.conf /etc/httpd/conf.d/directory-listing.conf
#   sudo apachectl configtest && sudo systemctl reload httpd
#
# Adjust DocumentRoot paths if Moodle is not under /var/www/html/lms_stage
# (production often uses /var/www/html/lms).
#
# Also ensure Alias /icons/ is commented out in httpd.conf / welcome.conf / alias.conf
# (CDAC Instance 2: Index of /icons).

Options -Indexes
ServerSignature Off

# Global: no indexes anywhere this vhost serves.
<Directory "/var/www/html">
    Options -Indexes +FollowSymLinks
    AllowOverride All
</Directory>

# --- Sensitive / ops paths (staging layout) ---
<Directory "/var/www/html/lms_stage/backups">
    Require all denied
</Directory>
<Directory "/var/www/html/lms_stage/docs">
    Require all denied
</Directory>
<Directory "/var/www/html/lms_stage/scripts">
    Require all denied
</Directory>
<Directory "/var/www/html/lms_stage/local_dev_logs">
    Require all denied
</Directory>
<Directory "/var/www/html/lms_stage/.git">
    Require all denied
</Directory>
<Directory "/var/www/html/lms_stage/.ddev">
    Require all denied
</Directory>

# Staging dataroot (sibling of lms_stage — must never be web-readable).
<Directory "/var/www/html/moodledata_stage">
    Require all denied
</Directory>

# Also cover common names if present.
<Directory "/var/www/html/lms_stage/moodledata">
    Require all denied
</Directory>
<Directory "/var/www/html/moodledata">
    Require all denied
</Directory>

# Block config fragments and probe scripts by URL.
<IfModule mod_rewrite.c>
    RewriteEngine On
    # Only apply when request is under Moodle (optional DocumentRoot-relative).
    RewriteRule (^|/)config\.(staging|production|dev)\.php$ - [F,L]
    RewriteRule (^|/)config\.(staging|production)\.php\.example$ - [F,L]
    RewriteRule (^|/)config-dist\.php$ - [F,L]
    RewriteRule (^|/)info\.php$ - [F,L]
    RewriteRule (^|/)phpinfo\.php$ - [F,L]
    RewriteRule (^|/)test\.php$ - [F,L]
    RewriteRule (^|/)i\.php$ - [F,L]
    # Backup / VCS style leftovers
    RewriteRule \.(bak|old|orig|save|swp|sql|sql\.gz|tar|tar\.gz|tgz)$ - [F,L]
    # Directory-style pluginfile (CDAC Instance 3; also enforced in PHP).
    RewriteRule (?:token)?pluginfile\.php/.+/$ - [F,L]
    RewriteRule webservice/pluginfile\.php/.+/$ - [F,L]
</IfModule>

# Block Apache default /icons/ alias tree (directory listing PoC).
<Location "/icons">
    Require all denied
</Location>
