# Sentry envelope path — staging/production nginx / Tengine / OpenResty.
# Include inside the LMS HTTPS server { } block.
# DDEV already loads .ddev/nginx/sentry-envelope-404.conf.
#
# CDAC PoC was Origin/Referer api.razorpay.com → o*.ingest.sentry.io
# with sentry.javascript.browser/7.64.0. This rule only covers the LMS origin.

location ~* /api/[0-9]+/envelope {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    return 404 '{"ok":false,"success":false,"error":"notfound"}';
}
