# Host header injection — Apache VirtualHost (not .htaccess).
# Use a default vhost that 400s unknown Host values.
#
#   sudo apachectl configtest && sudo systemctl reload httpd

# Catch-all first (must be the default *:443 if this is the first SSL vhost,
# or set _default_).
<VirtualHost _default_:443>
    SSLEngine on
    # Same cert as the LMS vhost so the handshake completes.
    # SSLCertificateFile /path/to/fullchain.pem
    # SSLCertificateKeyFile /path/to/privkey.pem
    UseCanonicalName On
    ServerName unused.invalid
    Redirect 400 /
</VirtualHost>

# Real LMS vhost — exact name only:
# <VirtualHost *:443>
#     ServerName staginglms.eci.gov.in
#     UseCanonicalName On
#     ServerName staginglms.eci.gov.in
#     # Do not set UseCanonicalName Off (that trusts Host).
# </VirtualHost>
