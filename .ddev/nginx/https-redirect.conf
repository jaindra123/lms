# Traefik forwards HTTP as X-Forwarded-Proto: http. Send users to HTTPS so
# Secure session cookies and logintoken stay on the same origin (one-click login).
# Direct http://127.0.0.1:8080 has no forwarded proto and is left alone.
#
# Do NOT 301 Moodle JS/CSS slash-arg scripts. RequireJS loads core/first via
# <script src>; a 301 text/html body becomes "Unexpected end of input" /
# "No define call for core/first".

set $iiidem_https_redir "";
if ($http_x_forwarded_proto = "http") {
    set $iiidem_https_redir "1";
}
if ($host = "127.0.0.1") {
    set $iiidem_https_redir "";
}
if ($host = "localhost") {
    set $iiidem_https_redir "";
}
if ($request_uri ~* "^/(lib/requirejs|lib/javascript|lib/jslib|lib/jssourcemap|theme/yui_combo|theme/javascript|theme/jquery|theme/styles|theme/image|theme/font)\.php") {
    set $iiidem_https_redir "";
}
if ($iiidem_https_redir = "1") {
    return 301 https://$host$request_uri;
}
