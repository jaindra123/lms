# Disable directory listing and block HTTP access to sensitive / source paths.
# Included inside the DDEV nginx server block via /mnt/ddev_config/nginx/*.conf.
# See docs/directory-listing.md and docs/source-code-disclosure.md.

autoindex off;

# Project-specific sensitive directories (listing + direct file download).
location ^~ /backups/ {
    deny all;
    return 403;
}
location ^~ /moodledata/ {
    deny all;
    return 403;
}
location ^~ /local_dev_logs/ {
    deny all;
    return 403;
}
location ^~ /docs/ {
    deny all;
    return 403;
}
location ^~ /scripts/ {
    deny all;
    return 403;
}
location ^~ /.git/ {
    deny all;
    return 403;
}
location ^~ /.ddev/ {
    deny all;
    return 403;
}
location ^~ /.github/ {
    deny all;
    return 403;
}
location ^~ /.grunt/ {
    deny all;
    return 403;
}
location ^~ /.upgradenotes/ {
    deny all;
    return 403;
}
location ^~ /.cursor/ {
    deny all;
    return 403;
}
location ^~ /agent-transcripts/ {
    deny all;
    return 403;
}

# Env-specific config fragments must never be fetched directly.
location ~* ^/config\.(staging|production|dev)\.php$ {
    deny all;
    return 403;
}
location ~* ^/config\.(staging|production)\.php\.example$ {
    deny all;
    return 403;
}
location = /config-dist.php {
    deny all;
    return 403;
}

# CDAC Directory listing retest — hide empty/internal scripts (not Index of / tables).
# /config and /version were rewritten to .php → blank 200. /cache/forms.php is empty.
# /auth/index.html is an empty placeholder. Return 404; do not serve them.
location = /config { return 404; }
location = /config.php { return 404; }
location = /version { return 404; }
location = /version.php { return 404; }
location = /security { return 404; }
location = /security.php { return 404; }
location = /cache/forms { return 404; }
location = /cache/forms.php { return 404; }
location = /cache/forms/ { return 404; }
location = /auth/index.html { return 404; }

# Leftover phpinfo droppings (common audit finding). Moodle's real page is
# /admin/phpinfo.php and already requires site admin.
location = /info.php {
    deny all;
    return 403;
}
location = /phpinfo.php {
    deny all;
    return 403;
}
location = /test.php {
    deny all;
    return 403;
}
location = /i.php {
    deny all;
    return 403;
}

# Apache default icon alias (CDAC Instance 2: /icons/ + apache_pb.gif).
# Not used by Moodle; TinyMCE icons live under /lib/editor/tiny/js/tinymce/icons/.
location ^~ /icons/ {
    deny all;
    return 404;
}

# CDAC Instance 3 — pluginfile path ending with / (no filename). Also enforced in PHP.
location ~* ^/(?:webservice/)?(?:token)?pluginfile\.php/.+/$ {
    return 403;
}

# Source / backup / editor leftovers (scanner: “source code disclosure pattern”).
location ~* \.(?:bak|old|orig|save|swp|swo|tmp|temp|dist|sql|sql\.gz|tar|tar\.gz|tgz|rar|7z)$ {
    deny all;
    return 403;
}
location ~* ~$ {
    deny all;
    return 403;
}
location ~* /(?:\.env(?:\..*)?)$ {
    deny all;
    return 403;
}

# Moodle recommended: hide internal / dependency / test artefacts (MDL-69333).
# npm-shrinkwrap.json is Moodle's lockfile (same role as package-lock.json) and
# must not be downloaded over HTTP (RT-001 / CWE-200).
location = /npm-shrinkwrap.json { deny all; return 404; }
location = /package-lock.json { deny all; return 404; }
location = /package.json { deny all; return 404; }
location = /yarn.lock { deny all; return 404; }
location = /pnpm-lock.yaml { deny all; return 404; }
location ~* (?:/vendor/|/node_modules/|/composer\.(?:json|lock)$|/package(?:-lock)?\.json$|/npm-shrinkwrap\.json$|/yarn\.lock$|/pnpm-lock\.yaml$|/(?:readme|README)(?:\.txt|/|$)|/upgrade\.txt$|/UPGRADING\.md$|/db/install\.xml$|/fixtures/|/behat/|/phpunit\.xml(?:\.dist)?$|/environment\.xml$|\.lock$) {
    deny all;
    return 404;
}
