# CDAC: Insufficient Rate Limiting on Prefill Data Encryption API.
# Razorpay hosts /v1/standard_checkout/checkout/prefill/encrypt — not this LMS.
# Any request to that path on this origin is rate-limited (HTTP 429).
# Staging Tengine: copy to the LMS server { } block (docs/snippets/nginx-prefill-encrypt-429.conf).

location ~* prefill/encrypt {
    default_type application/json;
    add_header Retry-After 600 always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    return 429 '{"ok":false,"success":false,"error":"ratelimit"}';
}
