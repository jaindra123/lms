# Hide server / PHP version tokens from HTTP responses.
# Included inside the DDEV nginx server block.
server_tokens off;
fastcgi_hide_header X-Powered-By;
fastcgi_hide_header X-AspNet-Version;
fastcgi_hide_header X-AspNetMvc-Version;
fastcgi_hide_header X-Generator;
fastcgi_hide_header Server;
proxy_hide_header Server;
proxy_hide_header X-Powered-By;
fastcgi_hide_header X-UA-Compatible;
proxy_hide_header X-UA-Compatible;
