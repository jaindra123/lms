# CDAC: Outdated Sentry JavaScript Browser SDK (7.64.0).
# That client lives on Razorpay Checkout (Origin api.razorpay.com → ingest.sentry.io).
# This LMS does not ship Sentry. Envelope URLs on this origin are 404.
# Staging Tengine: copy into the LMS server { } (docs/snippets/nginx-sentry-envelope-404.conf).

location ~* /api/[0-9]+/envelope {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    return 404 '{"ok":false,"success":false,"error":"notfound"}';
}
