# Canonical login: /login and /login/ → login/index.php (no public /login/ dir URL).
# After editing: ddev restart (or ddev nginx reload).
# Staging Apache: put the same RewriteRule in the VirtualHost (see docs/extensionless-urls.md).

location = /login {
    rewrite ^ /login/index.php last;
}

location = /login/ {
    rewrite ^ /login/index.php last;
}
