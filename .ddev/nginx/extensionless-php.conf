# Extensionless Moodle scripts: /admin/search → /admin/search.php (via PHP-FPM).
#
# Regex must NOT match trailing-slash URIs (/my/, /course/) — those are real
# directories served via index.php. [^.]+ wrongly matched "/my/" and rewrote to
# non-existent my.php → nginx 404.
#
# Prefer sibling .php over a same-named directory (admin/settings.php vs settings/).
# After editing: ddev restart
# See docs/extensionless-urls.md

# Paths with no "." and no trailing slash, e.g. /admin/search or /my
# /config /version /cache/forms are 404'd in directory-listing.conf (exact locations).
location ~ ^(/[^./]+(?:/[^./]+)*)$ {
    absolute_redirect off;
    try_files $uri @extensionless_php;
}

location @extensionless_php {
    absolute_redirect off;
    # Sibling script wins (settings.php over settings/).
    if (-f $document_root$uri.php) {
        rewrite ^ $uri.php last;
    }
    # Real Moodle dirs (/my, /course, /admin) → trailing slash + index.php
    if (-d $document_root$uri) {
        return 301 $uri/;
    }
    return 404;
}
