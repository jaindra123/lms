# LUCKY13 — AEAD-only ciphers on DDEV web nginx (listen 443 ssl).
# Included inside the default server { } via /mnt/ddev_config/nginx/*.conf.
# Production/staging Tengine uses docs/snippets/nginx-tls-no-cbc.conf instead.
# DDEV Traefik on :443: do not add a top-level tls: YAML (it wipes mkcert).

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:!ECDHE-RSA-AES128-SHA256:!ECDHE-RSA-AES256-SHA384:!CBC:!aNULL:!eNULL:!EXPORT:!DES:!3DES:!RC4:!MD5:!PSK:!SRP:!CAMELLIA:!ARIA:!DSS:!SHA1';
ssl_ecdh_curve X25519:prime256v1:secp384r1;
