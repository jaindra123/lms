# CDAC: "Windows Session token" — Razorpay window.session_token on
# GET /v1/checkout/public (Host api.razorpay.com). This LMS does not host Checkout.
# Staging Tengine: copy into the LMS server { } (docs/snippets/nginx-checkout-public-404.conf).

location ~* /v1/checkout/(public|qr_code) {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    return 404 '{"ok":false,"success":false,"error":"notfound"}';
}
