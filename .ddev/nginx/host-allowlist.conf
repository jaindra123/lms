# Reject Host headers that are not this DDEV project (CWE-644).
# PHP config.php also returns 400; this stops the request at nginx.
# LAN access via RFC1918 Host is allowed (see docs/LAN-ACCESS.md).

set $iiidem_host_ok 0;
if ($host = "iiidem-certification.ddev.site") { set $iiidem_host_ok 1; }
if ($host = "127.0.0.1") { set $iiidem_host_ok 1; }
if ($host = "localhost") { set $iiidem_host_ok 1; }
if ($host ~ "^10\.") { set $iiidem_host_ok 1; }
if ($host ~ "^192\.168\.") { set $iiidem_host_ok 1; }
if ($host ~ "^172\.(1[6-9]|2[0-9]|3[01])\.") { set $iiidem_host_ok 1; }
if ($host = "164.100.26.245") { set $iiidem_host_ok 1; }
if ($iiidem_host_ok = 0) {
    return 400;
}
